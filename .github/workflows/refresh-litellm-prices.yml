name: Refresh LiteLLM prices

on:
  schedule:
    # Monday 06:17 UTC. Fetching the pinned LiteLLM price file is the one
    # network exception. The job opens a pull request and never pushes to main.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: litellm-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Refresh the bundled snapshot
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          python scripts/refresh_litellm_snapshot.py
          paths=(
            src/tracetally/pricing/data/model_prices_and_context_window.json
            src/tracetally/pricing/catalog.py
            NOTICE
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Offline tests
        id: tests
        if: steps.refresh.outputs.changed == 'true'
        continue-on-error: true
        run: python -m pytest --disable-socket
      - name: Open a pull request
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          refspec="$(python scripts/refresh_litellm_snapshot.py --print-push-ref)"
          case "$refspec" in
            HEAD:refs/heads/automated/litellm-snapshot) ;;
            *)
              echo "refusing unexpected refspec: $refspec" >&2
              exit 1
              ;;
          esac
          branch="${refspec#HEAD:refs/heads/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -- \
            src/tracetally/pricing/data/model_prices_and_context_window.json \
            src/tracetally/pricing/catalog.py \
            NOTICE
          git commit -m "Refresh bundled LiteLLM price snapshot"
          if git fetch origin "$branch"; then
            git push --force-with-lease="refs/heads/${branch}:refs/remotes/origin/${branch}" origin "$refspec"
          else
            git push origin "$refspec"
          fi
          body="$(python scripts/refresh_litellm_snapshot.py --print-pr-body "${{ steps.tests.outcome }}")"
          # Update the open pull request, or open one. A merged or closed
          # request is left alone; `gh pr create` opens a new one.
          open_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --title "Refresh bundled LiteLLM price snapshot" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "Refresh bundled LiteLLM price snapshot" --body "$body"
          fi
