name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# Trusted Publishing only. No API token is read or stored.
# PyPI's pending publisher matches this file name (release.yml) and the
# publish job's environment name (pypi). A v* tag — v0.1.0 for this release —
# builds the sdist and wheel, then waits for a reviewer on that environment.

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Smoke-test the wheel offline
        run: |
          python -m venv /tmp/tt
          /tmp/tt/bin/pip install dist/*.whl
          /tmp/tt/bin/tracetally version
          /tmp/tt/bin/tracetally summary examples/synthetic.jsonl --json
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tracetally
    permissions:
      id-token: write
      actions: read
      attestations: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
