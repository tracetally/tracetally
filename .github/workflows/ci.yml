# Trimmed while this repo is private. When repository.private is false,
# every trigger uses the full matrix, including pull requests. If that
# flag cannot be read, the trimmed matrix stays. Run the full matrix once
# via workflow_dispatch (full_matrix) on the release-candidate head before
# tagging. A push to main does not cancel that dispatch.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run ubuntu, macOS, and Windows on Python 3.10-3.13
        type: boolean
        default: false

permissions:
  contents: read

# event_name keeps a push to main from cancelling a workflow_dispatch
# full-matrix run on the same ref. Only a newer pull_request cancels.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Mypy
        run: mypy src
      - name: No HTTP clients in the runtime dependency tree
        run: python scripts/check_no_http_clients.py

  # Matrix from the event. Default is ubuntu 3.10 and 3.13. Full is
  # full_matrix, or any trigger once repository.private is false.
  test-matrix:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
      python-version: ${{ steps.pick.outputs.python-version }}
    steps:
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_MATRIX: ${{ inputs.full_matrix }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          # PRIVATE is "false" only when the payload says the repo is public.
          # An empty value means visibility could not be read: stay trimmed.
          full=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FULL_MATRIX" = "true" ]; then
            full=true
          fi
          if [ "$PRIVATE" = "false" ]; then
            full=true
          fi
          if [ "$full" = "true" ]; then
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'python-version=["3.10","3.11","3.12","3.13"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'python-version=["3.10","3.13"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: [lint, test-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.test-matrix.outputs.os) }}
        python-version: ${{ fromJSON(needs.test-matrix.outputs.python-version) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest with sockets disabled
        run: python -m pytest --disable-socket

  coverage:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Coverage
        run: python -m pytest --disable-socket --cov --cov-fail-under=85

  package:
    needs: [test, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test the wheel offline
        run: |
          python -m venv /tmp/tt
          /tmp/tt/bin/pip install dist/*.whl
          /tmp/tt/bin/tracetally summary examples/synthetic_otel.json --offline
          /tmp/tt/bin/tracetally summary examples/synthetic.jsonl --json --offline
          /tmp/tt/bin/tracetally demo --out /tmp/tt-demo --seed 1 --offline
          test -s /tmp/tt-demo/report.html
          test -s /tmp/tt-demo/report.md
          test -s /tmp/tt-demo/findings.json
          /tmp/tt/bin/python scripts/check_no_http_clients.py
