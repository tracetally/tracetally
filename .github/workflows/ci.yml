name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Mypy
        run: mypy src
      - name: Network allowlist
        run: python scripts/check_no_http_clients.py

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest with sockets disabled
        run: python -m pytest --disable-socket

  coverage:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Coverage
        run: python -m pytest --disable-socket --cov --cov-fail-under=85

  package:
    needs: [test, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Package contains only the LiteLLM snapshot as data
        run: python scripts/check_package_contents.py dist/*
      # One offline smoke of the built wheel. PR A's package smoke and this
      # clean-wheel smoke both install that wheel and stay offline, so they
      # are one step: a fresh venv, then `tracetally analyze --offline` on
      # JSONL generated at runtime by tests.support.synthetic. Do not call
      # summary or demo, and do not read a committed file under examples/.
      - name: Install the wheel in a fresh venv and analyze --offline
        run: |
          python -m venv /tmp/tt
          /tmp/tt/bin/pip install dist/*.whl
          /tmp/tt/bin/python scripts/check_no_http_clients.py
          /tmp/tt/bin/python scripts/clean_wheel_smoke.py /tmp/tt/bin/tracetally
      # TODO(B1): `tracetally run` is not on this branch. Enable this step
      # together with RUN_OFFLINE_ENABLED in scripts/clean_wheel_smoke.py.
      # Command: tracetally run --offline <runtime-generated.jsonl>
      - name: "TODO(B1): tracetally run --offline on the runtime-generated JSONL"
        if: ${{ false }}
        run: |
          echo "TODO(B1): tracetally run --offline on the runtime-generated JSONL"
          exit 1
      # TODO(B1): enable with EMPTY_FOLDER_ENABLED. The empty directory must
      # print "No LLM usage file found" and exit 0.
      # Command: tracetally run --offline <empty-directory>
      - name: "TODO(B1): empty folder prints No LLM usage file found and exits 0"
        if: ${{ false }}
        run: |
          echo "TODO(B1): empty folder must print 'No LLM usage file found' and exit 0"
          exit 1
      # TODO(B2): auto-detect. A directory of mixed usage files, no format flag.
      # Enable with AUTO_DETECT_ENABLED in scripts/clean_wheel_smoke.py.
      - name: "TODO(B2): auto-detect a directory of mixed usage files, no format flag"
        if: ${{ false }}
        run: |
          echo "TODO(B2): auto-detect a directory of mixed usage files; do not pass a format flag"
          exit 1
