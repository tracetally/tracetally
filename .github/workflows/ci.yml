# Trimmed while this repo is private. Run the full matrix once via
# workflow_dispatch (full_matrix) on the release-candidate head before
# tagging. Revert this trim once the repo is public.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run ubuntu, macOS, and Windows on Python 3.10-3.13
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Mypy
        run: mypy src
      - name: Network allowlist
        run: python scripts/check_no_http_clients.py

  # Matrix from the event. Default is ubuntu 3.10 and 3.13. Full is
  # workflow_dispatch with full_matrix, or a push to main once the repo is public.
  test-matrix:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
      python-version: ${{ steps.pick.outputs.python-version }}
    steps:
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_MATRIX: ${{ inputs.full_matrix }}
          REF: ${{ github.ref }}
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          full=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FULL_MATRIX" = "true" ]; then
            full=true
          fi
          if [ "$REF" = "refs/heads/main" ] && [ "$VISIBILITY" = "public" ]; then
            full=true
          fi
          if [ "$full" = "true" ]; then
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'python-version=["3.10","3.11","3.12","3.13"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'python-version=["3.10","3.13"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: [lint, test-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.test-matrix.outputs.os) }}
        python-version: ${{ fromJSON(needs.test-matrix.outputs.python-version) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest with sockets disabled
        run: python -m pytest --disable-socket

  coverage:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Coverage
        run: python -m pytest --disable-socket --cov --cov-fail-under=85

  package:
    needs: [test, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Package contains only the LiteLLM snapshot as data
        run: python scripts/check_package_contents.py dist/*
      - name: Install the wheel in a fresh venv
        run: |
          python -m venv /tmp/tt
          /tmp/tt/bin/pip install dist/*.whl
          /tmp/tt/bin/python scripts/check_no_http_clients.py
      # Clean wheel, not an editable install. `tracetally run` arrives in B1,
      # which merges after this CI change. Until that command exists this step
      # fails. Do not substitute analyze, summary, demo, or committed examples.
      # B2 auto-detect is intentionally absent. Add that case in
      # scripts/clean_wheel_smoke.py when B2 lands.
      - name: Clean-wheel smoke
        run: /tmp/tt/bin/python scripts/clean_wheel_smoke.py /tmp/tt/bin/tracetally
