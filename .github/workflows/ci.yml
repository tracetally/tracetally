name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Mypy
        run: mypy src
      - name: No HTTP clients in the runtime dependency tree
        run: python scripts/check_no_http_clients.py

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest with sockets disabled
        run: python -m pytest --disable-socket

  coverage:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Coverage
        run: python -m pytest --disable-socket --cov --cov-fail-under=85

  package:
    needs: [test, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test the wheel offline
        run: |
          python -m venv /tmp/tt
          /tmp/tt/bin/pip install dist/*.whl
          /tmp/tt/bin/tracetally summary examples/synthetic_otel.json
          /tmp/tt/bin/tracetally summary examples/synthetic.jsonl --json
          /tmp/tt/bin/tracetally demo --out /tmp/tt-demo --seed 1
          test -s /tmp/tt-demo/report.html
          test -s /tmp/tt-demo/report.md
          test -s /tmp/tt-demo/findings.json
          /tmp/tt/bin/python scripts/check_no_http_clients.py
