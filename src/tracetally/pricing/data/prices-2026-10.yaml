# List prices for tracetally 0.1.
# Standard short-context text rates, per 1M tokens, USD.
# Every price has source_url and retrieved_on from the publisher's pricing page.
# Retrieved 2026-10-22. This file is not updated at runtime.
#
# reasoning, when set, is the published rate for reasoning or thinking tokens.
# OpenAI bills those as output tokens and includes them in output_tokens
# (https://developers.openai.com/api/docs/guides/reasoning). Gemini's output
# price is "including thinking tokens". The rate is therefore the output rate
# and is not added on top of output_tokens. Anthropic's pricing page does not
# publish a separate reasoning rate, so those models leave reasoning unset.
#
# Omitted on purpose, because the page did not give a single verifiable
# text rate: OpenAI models with a "272K" long-context split (the page does
# not state an integer threshold), Gemini prices that change on a later date,
# audio / image / priority / flex / regional rates, and Anthropic Fable and
# Mythos (the page uses marketing names and this table does not guess API ids).
# gpt-3.5-turbo-1106 is not on the OpenAI pricing page and is not listed.
# batch_discount is the published 50% Batch API multiplier applied to the
# whole computed cost. A few published batch tables do not halve cached input;
# that exception is not modeled separately.
schema_version: 1
table_id: "2026-10"
currency: USD
unit: per_1m_tokens
retrieved_on: "2026-10-22"
notes: >
  OpenAI, Anthropic, and Gemini Developer API standard list prices.
  Retrieved 2026-10-22 from each provider's pricing page.
  Azure OpenAI and Vertex AI are not priced from these lists.
  Reasoning and thinking tokens are not added on top of output tokens.

